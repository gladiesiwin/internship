<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, serif;
        }

        body {
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 800px;
            background: #fff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
        }

        input,
        textarea {
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background: #f7f7f7;
            font-size: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        textarea {
            height: 180px;
            resize: none;
        }

        button {
            background: #b8860b;
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 40px;
            font-size: 24px;
            cursor: pointer;
            display: block;
            margin: auto;
        }

        button:hover {
            background: #9c7207;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Send me a message</h1>

        <form>

            <input type="text" placeholder="Enter Your Name / Company *">

            <div class="row">
                <input type="email" placeholder="Enter Your Email *">
                <input type="text" placeholder="Enter Phone Number *">
            </div>

            <textarea placeholder="Write Message..."></textarea>

            <button type="submit">Send Message ✈</button>

        </form>

    </div>

</body>

</html>
