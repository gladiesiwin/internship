<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #42bfe6;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 30px;
        }

        .card {
            width: 320px;
            height: 550px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            color: rgb(255, 255, 255);
            background-size: cover;
            background-position: center;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        .content {
            position: absolute;
            inset: 0;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h2 {
            font-size: 55px;
            font-weight: bold;
            line-height: 1;
            margin-top: 170px;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #8a2be2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        .info {
            display: flex;
            gap: 20px;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div class="card" style="background-image:url('moon.jpg.jpg');">
        <div class="content">
            <h2>Short title,<br>long jacket</h2>

            <div class="bottom">
                <div class="logo">B</div>
                <div class="info">
                    <span>📍 Earth</span>
                    <span>📅 3d</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="background-image:url('flower.jpg.jpg');">
        <div class="content">
            <h2>Much longer title that wraps to multiple lines</h2>

            <div class="bottom">
                <div class="logo">B</div>
                <div class="info">
                    <span>📍 Pakistan</span>
                    <span>📅 4d</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="background-image:url('jellyfish.jpg.jpg');">
        <div class="content">
            <h2>Another longer title belongs here</h2>

            <div class="bottom">
                <div class="logo">B</div>
                <div class="info">
                    <span>📍 California</span>
                    <span>📅 5d</span>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
