<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Bottle Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 300px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: contain;
        }

        .title {
            font-size: 24px;
            margin: 10px 0;
        }

        .rating {
            display: inline-block;
            background: green;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .reviews {
            color: gray;
            margin-left: 5px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .old-price {
            color: gray;
            text-decoration: line-through;
            margin-left: 5px;
        }

        .discount {
            color: green;
            margin-left: 5px;
            font-weight: bold;
        }

        .stock {
            color: #e91e63;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="bottle.jpg" alt="Bottle">
            <div class="title">SKYLIFE Water Bottle</div>

            <span class="rating">4★</span>
            <span class="reviews">(2,020)</span>

            <div class="price">
                ₹118
                <span class="old-price">₹599</span>
                <span class="discount">80% off</span>
            </div>

            <div class="stock">Only few left</div>
        </div>

        <div class="card">
            <img src="bottle2.jpg" alt="Bottle">
            <div class="title">ELINOR Steel Water Bottle</div>

            <span class="rating">4.1★</span>
            <span class="reviews">(16,395)</span>

            <div class="price">
                ₹178
                <span class="old-price">₹499</span>
                <span class="discount">64% off</span>
            </div>

            <div class="stock">Only few left</div>
        </div>

        <div class="card">
            <img src="bottle3.jpg" alt="Bottle">
            <div class="title">DFit 2L Motivational Bottle</div>

            <span class="rating">4.1★</span>
            <span class="reviews">(23,274)</span>

            <div class="price">
                ₹164
                <span class="old-price">₹1,288</span>
                <span class="discount">87% off</span>
            </div>

            <div class="stock">Only few left</div>
        </div>

    </div>

</body>

</html>
