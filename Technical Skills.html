<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical Skills</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, serif;
        }

        body {
            background: #000;
            color: #fff;
            padding: 40px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid #b58b00;
            color: #fff;
            background: #2b2200;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .section-title h1 {
            color: #d4a017;
            font-size: 60px;
            margin-bottom: 15px;
        }

        .section-title p {
            font-size: 20px;
        }

        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .skill-card {
            background: #f3f3f3;
            color: #000;
            border-radius: 25px;
            padding: 35px;
        }

        .skill-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #eee8dc;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b58b00;
            font-size: 30px;
        }

        .skill-header h2 {
            font-size: 38px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tag {
            background: #eee8dc;
            color: #b58b00;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 22px;
        }

        @media(max-width:768px) {
            .section-title h1 {
                font-size: 40px;
            }

            .skill-header h2 {
                font-size: 28px;
            }

            .tag {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="section-title">
        <div class="badge">Skills & Expertise</div>
        <h1>Technical Skills</h1>
        <p>Technologies and tools I use to design and develop modern web solutions</p>
    </div>

    <div class="skills-container">

        <!-- Frontend -->
        <div class="skill-card">
            <div class="skill-header">
                <div class="icon-box">
                    <i class="fa-solid fa-window-maximize"></i>
                </div>
                <h2>Frontend</h2>
            </div>

            <div class="tags">
                <div class="tag">c</div>
                <div class="tag">C++</div>
                <div class="tag">Python</div>
                <div class="tag">Css</div>
            </div>
        </div>

        <!-- Backend -->
        <div class="skill-card">
            <div class="skill-header">
                <div class="icon-box">
                    <i class="fa-solid fa-database"></i>
                </div>
                <h2>Backend / CMS</h2>
            </div>

            <div class="tags">
                <div class="tag">WordPress</div>
                <div class="tag">Php</div>
                <div class="tag">MySQL</div>
            </div>
        </div>

        <!-- Design Tools -->
        <div class="skill-card">
            <div class="skill-header">
                <div class="icon-box">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <h2>Design Tools</h2>
            </div>

            <div class="tags">
                <div class="tag">Adobe </div>
                <div class="tag">Canva</div>
                <div class="tag">Figma</div>
            </div>
        </div>

        <!-- Dev Tools -->
        <div class="skill-card">
            <div class="skill-header">
                <div class="icon-box">
                    <i class="fa-solid fa-server"></i>
                </div>
                <h2>Dev Tools</h2>
            </div>

            <div class="tags">
                <div class="tag">React.js</div>
                <div class="tag">GitHub</div>
            </div>
        </div>

    </div>

</body>

</html>
