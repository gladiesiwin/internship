<!DOCTYPE html>
<html>
<head>
    <title>My Tech Stack</title>
    <style>
        body {
            background: #0f172a;
            font-family: Arial, sans-serif;
            padding: 30px 20px;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 30px;
        }
        h1 span {
            color: #61dafb;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .item {
            background: #1e293b;
            padding: 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            border: 1px solid #334155;
            width: 100px;
            text-align: center;
            transition: transform 0.2s, background 0.2s;
        }
        .item:hover {
            transform: translateY(-5px);
            background: #2d3a5e;
            border-color: #61dafb;
        }
        .item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
        }
        .item span {
            display: block;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>MY <span>TECH STACK</span></h1>
    <div class="grid">
        <div class="item">
            <img src="images2.jpg"
            <span>C++</span>
        </div>
        <div class="item">
            <img src="image3.png"
            <span>Python</span>
        </div>
        <div class="item">
            <img src="im.png"
            <span>Java</span>
        </div>
        <div class="item">
            <img src="image5.jpg"
            <span>HTML</span>
        </div>
        <div class="item">
            <img src="image6.jpg"
            <span>CSS</span>
        </div>
        <div class="item">
            <img src="image7.jpg"
            <span>JavaScript</span>
        </div>
        <div class="item">
            <img src="image8.jpg"
            <span>SQL</span>
        </div>
        <div class="item">
            <img src="imag.png"
            <span>Git</span>
        </div>
        <div class="item">
            <img src="imag1.jpg"
            <span>Docker</span>
        </div>
        <div class="item">
            <img src="imag2.jpg"
            <span>VS Code</span>
        </div>
        <div class="item">
            <img src="imag4.jpg"
            <span>GitHub</span>
        </div>
    </div>
</body>
</html>
