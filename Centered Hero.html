<!DOCTYPE html>
<html>

<head>
    <title>Centered Hero</title>
    <style>
        body {
            margin: 0;
            background: rgb(251 183 236);
            font-family: Arial, sans-serif;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            font-size: 70px;
            color: 48cae4;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            color: c9184a;
            max-width: 900px;
            margin: auto;
            line-height: 1.8;
        }

        .buttons {
            margin-top: 40px;
        }

        .btn1 {
            background: #d64bf9;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn2 {
            background: rgb(240 8 255);
            color: #fff;
            border: 1px solid rgb(240 8 255);
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Centered hero</h1>

        <p>
        <p>
            Welcome to my personal website. Here you can learn about my skills,
            projects, and achievements. I am passionate about web development
            and creating modern, responsive websites.
        </p>
        </p>

        <div class="buttons">
            <button class="btn1">Primary button</button>
            <button class="btn2">Secondary</button>
        </div>
    </div>

</body>

</html>
