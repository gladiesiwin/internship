<!DOCTYPE html>
<html>
<head>
    <title>About Me</title>

    <style>

        body{
            background:black;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        h1{
            font-size:40px;
        }

        .line{
            width:80px;
            height:4px;
            background:cyan;
            margin-bottom:20px;
        }

        .container{
            display:flex;
            gap:30px;
        }

        img{
            width:500px;
            border-radius:10px;

        }

        .content{
            width:50%;
        }

        h2{
            font-size:35px;
        }

        p{
            color:lightgray;
            line-height:30px;
            font-size:18px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            margin-top:20px;
        }

        .card{
            background:#111;
            padding:20px;
            border-radius:10px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            background:teal;
            color:white;
            font-size:20px;
            border-radius:8px;
        }

    </style>
</head>

<body>

    <h1>About Me</h1>

    <div class="line"></div>

    <p>
        A passionate engineer dedicated to solving problems through innovative solutions.
    </p>

    <div class="container">

        <img src="images1.jpg" alt="About Image">

        <div class="content">

            <h2>Professional Engineer</h2>

            <p>
                I am a dedicated engineering student with strong technical skills
                and problem-solving knowledge.
            </p>

            <div class="cards">

                <div class="card">
                    <h3>Education</h3>
                    <p>B.Sc</p>
                </div>

                <div class="card">
                    <h3>Experience</h3>
                    <p>2Years</p>
                </div>

                <div class="card">
                    <h3>Projects</h3>
                    <p>10+</p>
                </div>

                <div class="card">
                    <h3>Skills</h3>
                    <p>HTML CSS</p>
                </div>

            </div>

            <button>Learn More</button>

        </div>

    </div>

</body>
</html>
